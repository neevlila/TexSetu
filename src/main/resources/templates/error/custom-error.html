<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Error')}"></head>
<body class="bg-light d-flex flex-column min-vh-100">
    <div th:replace="~{fragments/layout :: navbar}"></div>

    <main class="container py-5 my-auto">
        <div class="row justify-content-center">
            <div class="col-md-7 text-center">
                <div class="card shadow-sm p-4 border-0">
                    <div class="mb-3 text-warning">
                        <i class="bi bi-exclamation-triangle-fill display-3"></i>
                    </div>
                    <h3 class="fw-bold" th:text="${errorTitle ?: 'Notice'}">Notice</h3>
                    <p class="text-secondary mt-2 mb-4" th:text="${errorMessage ?: 'An unexpected issue occurred.'}">Error details</p>
                    <div>
                        <a href="javascript:history.back()" class="btn btn-outline-secondary me-2"><i class="bi bi-arrow-left me-1"></i> Go Back</a>
                        <a th:href="@{/}" class="btn btn-teal text-white"><i class="bi bi-house me-1"></i> Return Home</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
