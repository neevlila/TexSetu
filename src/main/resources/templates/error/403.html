<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Access Denied')}"></head>
<body class="bg-light d-flex flex-column min-vh-100">
    <div th:replace="~{fragments/layout :: navbar}"></div>

    <main class="container py-5 my-auto">
        <div class="row justify-content-center">
            <div class="col-md-6 text-center">
                <div class="card shadow-sm p-4 border-0">
                    <div class="mb-3 text-danger">
                        <i class="bi bi-shield-slash-fill display-3"></i>
                    </div>
                    <h3 class="fw-bold">403 - Access Denied</h3>
                    <p class="text-secondary mt-2 mb-4">You do not have permission to access this resource or perform this administrative action.</p>
                    <div>
                        <a th:href="@{/}" class="btn btn-teal text-white"><i class="bi bi-house me-1"></i> Return to Homepage</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
