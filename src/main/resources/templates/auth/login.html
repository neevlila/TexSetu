<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Sign In')}"></head>
<body class="bg-light d-flex flex-column min-vh-100">
    <div th:replace="~{fragments/layout :: navbar}"></div>
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <main class="container py-5 my-auto">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow-sm border-0 p-4 p-md-5">
                    <div class="text-center mb-4">
                        <span class="badge bg-teal p-2 rounded-circle fs-4 mb-2"><i class="bi bi-person-fill"></i></span>
                        <h3 class="fw-bold">Sign In to TexSetu</h3>
                        <p class="text-secondary small">Access your buyer or job-worker manufacturing portal</p>
                    </div>

                    <div th:if="${param.error}" class="alert alert-danger small py-2">
                        <i class="bi bi-exclamation-circle-fill me-1"></i> Invalid email or password. Please verify and try again.
                    </div>
                    <div th:if="${param.logout}" class="alert alert-info small py-2">
                        <i class="bi bi-info-circle-fill me-1"></i> You have been safely logged out.
                    </div>

                    <form th:action="@{/auth/login-process}" method="post">
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Business Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text bg-transparent text-muted"><i class="bi bi-envelope"></i></span>
                                <input type="email" id="emailInput" name="username" class="form-control" placeholder="name@business.com" required autofocus>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-transparent text-muted"><i class="bi bi-lock"></i></span>
                                <input type="password" id="passwordInput" name="password" class="form-control border-end-0" placeholder="Enter your password" required>
                                <button class="btn btn-outline-secondary border-start-0" type="button" onclick="togglePasswordVisibility()" title="Show/Hide Password">
                                    <i class="bi bi-eye" id="togglePasswordIcon"></i>
                                </button>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-teal text-white w-100 py-2 fw-semibold mt-2">Sign In to Dashboard</button>
                    </form>

                    <div class="text-center mt-4 text-muted small" style="font-size: 0.78rem;">
                        <i class="bi bi-shield-check text-teal me-1"></i> Verified 256-Bit SSL Encrypted Session
                    </div>

                    <div class="text-center mt-4 small">
                        Don't have an account? <a th:href="@{/auth/register}" class="text-teal fw-semibold">Register here</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        function togglePasswordVisibility() {
            const passInput = document.getElementById('passwordInput');
            const icon = document.getElementById('togglePasswordIcon');
            if (passInput.type === 'password') {
                passInput.type = 'text';
                icon.classList.remove('bi-eye');
                icon.classList.add('bi-eye-slash');
            } else {
                passInput.type = 'password';
                icon.classList.remove('bi-eye-slash');
                icon.classList.add('bi-eye');
            }
        }
    </script>

    <div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
