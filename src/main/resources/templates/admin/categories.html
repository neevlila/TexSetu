<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Service Categories')}"></head>
<body class="bg-light d-flex flex-column min-vh-100">
    <div th:replace="~{fragments/layout :: navbar}"></div>
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <main class="container-fluid px-lg-5 py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <span class="text-teal small fw-semibold text-uppercase">Taxonomy</span>
                <h2 class="fw-bold mb-0">Textile Processing Categories</h2>
                <small class="text-secondary">Core service types supported by the marketplace</small>
            </div>
            <div>
                <button type="button" class="btn btn-teal text-white fw-medium shadow-sm" data-bs-toggle="modal" data-bs-target="#categoryModal">
                    <i class="bi bi-plus-circle me-1"></i> Add Service Category
                </button>
            </div>
        </div>

        <div class="card shadow-sm border-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light small">
                        <tr>
                            <th>Category Code</th>
                            <th>Category Name</th>
                            <th>Description</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="cat : ${categories}">
                            <td class="fw-bold font-monospace text-navy" th:text="${cat.code}">DYE_FABRIC_PROC</td>
                            <td class="fw-semibold" th:text="${cat.name}">Dyeing and Fabric Processing</td>
                            <td class="small text-secondary" th:text="${cat.description}">Description</td>
                            <td>
                                <span class="badge" th:classappend="${cat.active} ? 'bg-success' : 'bg-secondary'" th:text="${cat.active} ? 'ACTIVE' : 'INACTIVE'">ACTIVE</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Add Category Modal -->
        <div class="modal fade" id="categoryModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <form th:action="@{/admin/categories/save}" method="post">
                        <div class="modal-header">
                            <h5 class="modal-title fw-bold"><i class="bi bi-layers text-teal me-2"></i>Add Service Category</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>
                        <div class="modal-body small">
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Category Code *</label>
                                <input type="text" name="code" class="form-control" placeholder="e.g. YARN_DYEING" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Category Name *</label>
                                <input type="text" name="name" class="form-control" placeholder="e.g. Yarn Dyeing & Sizing" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Description</label>
                                <textarea name="description" class="form-control" rows="2" placeholder="Describe the industrial processes included in this category"></textarea>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
                            <button type="submit" class="btn btn-teal text-white btn-sm fw-medium">Save Category</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
