<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('User Management')}"></head>
<body class="bg-light d-flex flex-column min-vh-100">
    <div th:replace="~{fragments/layout :: navbar}"></div>
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <main class="container-fluid px-lg-5 py-4">
        <div class="mb-4">
            <span class="text-teal small fw-semibold text-uppercase">User Administration</span>
            <h2 class="fw-bold mb-0">Platform Users & Account Status</h2>
            <p class="text-secondary small">Manage registered buyers, textile job-workers, and administrative access controls.</p>
        </div>

        <div class="card shadow-sm border-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light small">
                        <tr>
                            <th>User ID</th>
                            <th>Full Name</th>
                            <th>Email Address</th>
                            <th>Phone</th>
                            <th>Role</th>
                            <th>Account Status</th>
                            <th>Joined Date</th>
                            <th>Access Control</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="u : ${users}">
                            <td class="font-monospace" th:text="${u.id}">1</td>
                            <td class="fw-semibold" th:text="${u.fullName}">Name</td>
                            <td th:text="${u.email}">email@domain.com</td>
                            <td th:text="${u.phoneNumber}">+91 98250 XXXXX</td>
                            <td>
                                <span class="badge" th:classappend="${u.role.name() == 'ADMIN'} ? 'bg-dark' : (${u.role.name() == 'BUYER'} ? 'bg-primary' : 'bg-success')" th:text="${u.role}">ROLE</span>
                            </td>
                            <td>
                                <span class="badge" th:classappend="${u.accountStatus.name() == 'ACTIVE'} ? 'bg-success' : 'bg-danger'" th:text="${u.accountStatus}">ACTIVE</span>
                            </td>
                            <td th:text="${#temporals.format(u.createdAt, 'dd MMM yyyy')}">Date</td>
                            <td>
                                <div th:if="${u.role.name() != 'ADMIN'}">
                                    <form th:if="${u.accountStatus.name() == 'ACTIVE'}" th:action="@{/admin/users/{id}/toggle-status(id=${u.id})}" method="post">
                                        <input type="hidden" name="status" value="SUSPENDED">
                                        <button type="submit" class="btn btn-sm btn-outline-danger" onclick="return confirm('Suspend this user account?');">Suspend</button>
                                    </form>
                                    <form th:if="${u.accountStatus.name() == 'SUSPENDED'}" th:action="@{/admin/users/{id}/toggle-status(id=${u.id})}" method="post">
                                        <input type="hidden" name="status" value="ACTIVE">
                                        <button type="submit" class="btn btn-sm btn-outline-success" onclick="return confirm('Re-activate this user account?');">Activate</button>
                                    </form>
                                </div>
                                <span th:if="${u.role.name() == 'ADMIN'}" class="text-muted small">Protected</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
