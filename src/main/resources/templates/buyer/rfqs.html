<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('My RFQs')}"></head>
<body class="bg-light d-flex flex-column min-vh-100">
    <div th:replace="~{fragments/layout :: navbar}"></div>
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <main class="container-fluid px-lg-5 py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <span class="text-teal small fw-semibold text-uppercase">Requisitions</span>
                <h2 class="fw-bold mb-0">My Requests for Quotation</h2>
            </div>
            <div>
                <a th:href="@{/buyer/rfqs/new}" class="btn btn-teal text-white fw-medium shadow-sm">
                    <i class="bi bi-plus-circle me-1"></i> Post New RFQ
                </a>
            </div>
        </div>

        <div class="card shadow-sm border-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light small">
                        <tr>
                            <th>RFQ Reference</th>
                            <th>Category</th>
                            <th>Job Title</th>
                            <th>Quantity</th>
                            <th>Desired Date</th>
                            <th>Quotation Count</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="rfq : ${rfqs}">
                            <td class="fw-bold font-monospace" th:text="${rfq.rfqNumber}">RFQ-123</td>
                            <td><span class="badge bg-light text-secondary border" th:text="${rfq.category.name}">Category</span></td>
                            <td>
                                <div class="fw-semibold" th:text="${rfq.title}">Title</div>
                                <small class="text-muted text-truncate d-block" style="max-width: 280px;" th:text="${rfq.fabricDescription}">Description</small>
                            </td>
                            <td class="fw-bold"><span th:text="${rfq.quantity}">0</span> <span th:text="${rfq.unitOfMeasure}">MTS</span></td>
                            <td th:text="${#temporals.format(rfq.desiredCompletionDate, 'dd MMM yyyy')}">Date</td>
                            <td>
                                <span class="badge bg-secondary rounded-pill px-2 py-1" th:text="${rfq.quotations.size()} + ' Bids'">0 Bids</span>
                            </td>
                            <td>
                                <span class="badge" th:classappend="'badge-status-' + ${rfq.status}" th:text="${rfq.status}">OPEN</span>
                            </td>
                            <td>
                                <a th:href="@{/buyer/rfqs/{id}/quotes(id=${rfq.id})}" class="btn btn-sm btn-outline-teal">
                                    <i class="bi bi-bar-chart-steps me-1"></i> Compare Quotes (<span th:text="${rfq.quotations.size()}">0</span>)
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${rfqs.isEmpty()}">
                            <td colspan="8" class="text-center py-5 text-secondary small">
                                <i class="bi bi-file-earmark-plus display-4 d-block mb-2 text-muted"></i>
                                You have not submitted any Requests for Quotation yet.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
