spring:
  application:
    name: texsetu
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB
  jpa:
    open-in-view: true
  task:
    execution:
      pool:
        core-size: 4
        max-size: 10
        queue-capacity: 100
        thread-name-prefix: "texsetu-async-"

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        http-only: true
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

texsetu:
  storage:
    type: ${STORAGE_TYPE:local} # 'local' or 'supabase'
    local-dir: ${LOCAL_UPLOAD_DIR:uploads}
    supabase:
      url: ${SUPABASE_URL:}
      key: ${SUPABASE_KEY:}
      bucket: ${SUPABASE_BUCKET:texsetu-documents}
